version: 2
project_name: bsv-node-exporter

builds:
  - main: ./cmd/bsv-node-exporter
    binary: bsv-node-exporter
    env: [CGO_ENABLED=0]
    goos: [linux]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{ .Version }}"]

archives:
  - formats: [tar.gz]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

dockers_v2:
  - images: ["ghcr.io/bsv-blockchain/bsv-node-exporter"]
    # Published as a candidate; the release workflow scans this digest and only
    # then points the {{ .Version }} tag at it.
    tags: ["{{ .Version }}-candidate"]
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.source: https://github.com/bsv-blockchain/bsv-node-exporter
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"

release:
  github:
    owner: bsv-blockchain
    name: bsv-node-exporter
  # Un-drafted by the release workflow after the image scan passes.
  draft: true
