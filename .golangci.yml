version: "2"
linters:
  default: standard
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests read fixtures from computed paths. Only G304 is excluded; every
      # other gosec rule still applies to test code.
      - path: _test\.go
        linters: [gosec]
        text: G304
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
formatters:
  enable:
    - gofmt
    - goimports
