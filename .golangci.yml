version: "2"
linters:
  default: standard
  exclusions:
    presets:
      - std-error-handling
      - common-false-positives
    rules:
      # Tests read fixtures from computed paths (G304) and use package-level
      # helpers that predate request contexts.
      - path: _test\.go
        linters: [gosec]
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - noctx
    - revive
formatters:
  enable:
    - gofmt
    - goimports
