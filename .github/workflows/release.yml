name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: read
env:
  IMAGE: ghcr.io/bsv-blockchain/bsv-node-exporter
jobs:
  # Build once and publish only as a candidate: images to <version>-candidate,
  # archives to a draft release. Nothing carries the real version yet.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    outputs:
      version: ${{ steps.candidate.outputs.version }}
      digest: ${{ steps.candidate.outputs.digest }}
      checksums-sha256: ${{ steps.candidate.outputs.checksums_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - run: go test ./... -race -count=1
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
      - uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          syft-version: v1.52.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - id: candidate
        run: |
          version="${GITHUB_REF_NAME#v}"
          digest=$(docker buildx imagetools inspect "$IMAGE:$version-candidate" --format '{{json .Manifest}}' | jq -r .digest)
          # promote checks the draft's checksums.txt against checksums_sha256 before attesting it.
          {
            echo "version=$version"
            echo "digest=$digest"
            echo "checksums_sha256=$(sha256sum dist/checksums.txt | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

  # Read-only: scans the exact candidate digest for both platforms.
  scan:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    steps:
      # .trivyignore only. A full checkout would let a committed trivy.yaml
      # (read from the working directory) loosen the scan.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .trivyignore
          sparse-checkout-cone-mode: false
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
          TRIVY_IGNORE_UNFIXED: "false"
        with:
          version: v0.74.0
          image-ref: ${{ env.IMAGE }}@${{ needs.build.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: "1"
          # Unfixed findings fail too. An accepted risk goes in .trivyignore with a
          # reason, reviewed like code, not through a blanket filter.
          trivyignores: .trivyignore
          cache: false

  # Only after the scan: point <version> at the scanned digest, attest it, publish.
  promote:
    needs: [build, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: v0.37.2
          cache-binary: false
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Attest first, so <version> never points at an unattested digest.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ needs.build.outputs.digest }}
          push-to-registry: true
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHECKSUMS_SHA256: ${{ needs.build.outputs.checksums-sha256 }}
        # The draft's assets are mutable by anyone with contents:write. Before
        # attesting or publishing: checksums.txt must be the one build produced,
        # every asset must match it, and no asset may be missing from it.
        run: |
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir dist
          echo "$CHECKSUMS_SHA256  dist/checksums.txt" | sha256sum -c -
          cd dist
          sha256sum --strict -c checksums.txt
          listed=$(awk '{print $2}' checksums.txt)
          for f in *; do
            [ "$f" = checksums.txt ] && continue
            if ! grep -qxF -- "$f" <<<"$listed"; then
              echo "::error::release asset not in checksums.txt: $f"
              exit 1
            fi
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - env:
          DIGEST: ${{ needs.build.outputs.digest }}
          VERSION: ${{ needs.build.outputs.version }}
        run: docker buildx imagetools create -t "$IMAGE:$VERSION" "$IMAGE@$DIGEST"
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
